name: Feature request
description: Suggest a concrete teaching or grading workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic example or proposed behavior
      description: Avoid actual student submissions and personal information.
